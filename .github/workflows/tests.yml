name: Offline behavioral tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      VOCAB_VIDEO_CORE: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - run: python -B -m unittest discover -s tools -p 'test_*.py'
      - run: python -B -m unittest discover -s companions/music-preferences-import -p 'test_*.py'
      - run: python -B -m unittest discover -s unified -p 'test_*.py'
      - run: python scripts/demo.py --output demo-output
      - run: python companions/music-preferences-import/demo.py --output music-demo-output
      - run: python unified/run.py demo --output unified-demo-output
